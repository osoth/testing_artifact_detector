[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testing-artifact-detector"
version = "0.3.0"
description = "Command-line tool that clones Git repositories and analyses them for test artifact presence."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"pandas",
	"tree-sitter-cpp",
	"tree-sitter-cmake",
]

[project.scripts]
testing-artifact-detector = "testing_artifact_detector.cli:main"
testing-artifact-detector-ts = "testing_artifact_detector.cli2:main"
testing-artifact-detector-compare = "testing_artifact_detector.evaluation.comp_rgx_ts:main"
testing-artifact-detector-compare-deep = "testing_artifact_detector.evaluation.comp_rgx_ts_deep:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
filterwarnings = ["error"]
testpaths = ["test_suite"]
norecursedirs = "test_suite/*/test_data"
