[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testing-artifact-detector"
version = "0.3.0"
description = "Command-line tool that clones Git repositories and analyses them for test artifact presence."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"pandas",
	# Pinned to the versions the thesis cites, so a later run reproduces the
	# reported figures. A different grammar version can change the parse tree and
	# with it every count derived from it.
	"tree-sitter==0.26.0",
	"tree-sitter-cmake==0.7.2.post1",
]

[project.scripts]
testing-artifact-detector = "testing_artifact_detector.cli:main"
testing-artifact-detector-ts = "testing_artifact_detector.cli2:main"
testing-artifact-detector-compare = "testing_artifact_detector.evaluation.comp_rgx_ts:main"
testing-artifact-detector-figures = "testing_artifact_detector.evaluation.thesis_figures:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The CMake module list thesis_figures.py classifies unresolved includes against.
# Without this it is missing from a non-editable install.
"testing_artifact_detector.evaluation" = ["cmake_modules.txt"]

[tool.pytest.ini_options]
filterwarnings = ["error"]
testpaths = ["test_suite"]
norecursedirs = "test_suite/*/test_data"
